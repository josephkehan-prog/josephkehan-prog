<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <style>
    .frame { fill: #0d1117; stroke: #30363d; }
    .bar { fill: #161b22; }
    .txt { fill: #e6edf3; font-size: 15px; }
    .dim { fill: #8b949e; font-size: 15px; }
    .green { fill: #3fb950; font-size: 15px; }
    .blue { fill: #58a6ff; font-size: 15px; }
    .line { opacity: 0; animation: reveal 0.01s linear forwards; }
    .l1 { animation-delay: 0.4s; }
    .l2 { animation-delay: 1.2s; }
    .l3 { animation-delay: 2.2s; }
    .l4 { animation-delay: 3.0s; }
    .l5 { animation-delay: 4.0s; }
    .l6 { animation-delay: 4.8s; }
    .cursor { fill: #3fb950; animation: blink 1.1s steps(1) infinite 5.2s; opacity: 0; }
    @keyframes reveal { to { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>
  <rect class="frame" x="1" y="1" width="878" height="208" rx="10"/>
  <rect class="bar" x="1" y="1" width="878" height="34" rx="10"/>
  <rect class="bar" x="1" y="20" width="878" height="15"/>
  <circle cx="24" cy="18" r="6" fill="#f85149"/>
  <circle cx="46" cy="18" r="6" fill="#d29922"/>
  <circle cx="68" cy="18" r="6" fill="#3fb950"/>
  <text x="440" y="23" text-anchor="middle" class="dim" font-size="13">boredinnyc — zsh</text>

  <text x="24" y="66" class="line l1"><tspan class="green">$</tspan><tspan class="txt" dx="8">whoami</tspan></text>
  <text x="24" y="90" class="line l2"><tspan class="dim">boredinnyc — took time away from the dev space. it got boring.</tspan></text>

  <text x="24" y="122" class="line l3"><tspan class="green">$</tspan><tspan class="txt" dx="8">git status</tspan></text>
  <text x="24" y="146" class="line l4"><tspan class="dim">On branch</tspan><tspan class="blue" dx="6">comeback</tspan><tspan class="dim" dx="6">— local by default, public when ready</tspan></text>

  <text x="24" y="178" class="line l5"><tspan class="green">$</tspan><tspan class="txt" dx="8">make ship</tspan></text>
  <text x="24" y="178" class="line l6" dx="108"><tspan class="dim">  local-first, no cloud, runs on hardware you own</tspan></text>
  <rect class="cursor" x="24" y="192" width="9" height="4"/>
</svg>
